SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_sportsmot.yaml

DATA_ROOT: ./datasets
DATASETS: [SportsMOT]
DATASET_SPLITS: [train]

NUM_CLASSES: 1

# 数据中最多约 28 条鱼，50 个 ID 词表足够
NUM_ID_VOCABULARY: 50

# 使用第一阶段训练好的鱼类 DETR
DETR_PRETRAIN: ./checkpoints/fish_detector.pth

# 时间窗口参数必须协调
SAMPLE_LENGTHS: [60]
REL_PE_LENGTH: 60
MISS_TOLERANCE: 60

BATCH_SIZE: 1
EPOCHS: 13
LR: 1.0e-4
SCHEDULER_MILESTONES: [8, 12]
SAVE_CHECKPOINT_PER_EPOCH: 1

# 降低单卡显存压力
DETR_NUM_TRAIN_FRAMES: 4
DETR_NUM_CHECKPOINT_FRAMES: 2
USE_DECODER_CHECKPOINT: True

NUM_WORKERS: 6
USE_WANDB: False

INFERENCE_DATASET: SportsMOT
INFERENCE_SPLIT: val
INFERENCE_MODE: evaluate

DET_THRESH: 0.3
NEWBORN_THRESH: 0.6
ID_THRESH: 0.2
