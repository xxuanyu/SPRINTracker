SUPER_CONFIG_PATH: ./configs/pretrain_r50_deformable_detr_sportsmot.yaml

DATA_ROOT: ./datasets
DATASETS: [SportsMOT]
DATASET_SPLITS: [train]

NUM_CLASSES: 1

DETR_PRETRAIN: ./pretrains/r50_deformable_detr_coco.pth

